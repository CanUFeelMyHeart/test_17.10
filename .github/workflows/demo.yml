name: Demo Workflow
on:
  push: 
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print to console
        run: echo Hello GH Actions 
      - name: Print few lines
        run: |
          echo line1
          echo line2
          echo line3
  publish:
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: Print to console
        run: echo Hello GH Actions 
      - name: Print few lines
        run: ls -la
